name: Refresh Haraj Listings

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 << 'PYEOF'
          import re, json, requests
          from bs4 import BeautifulSoup

          SB_URL = __import__('os').environ['SUPABASE_URL']
          SB_KEY = __import__('os').environ['SUPABASE_KEY']
          HEADERS = {'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Prefer': 'resolution=merge-duplicates'}

          # Only keep listings whose title contains a model year — actual cars for sale
          YEAR_RE = re.compile(r'\b(19[89]\d|20[012]\d)\b')

          rows = []
          seen_ids = set()

          for page in range(1, 9):
              try:
                  url = f'https://haraj.com.sa/tags/%D8%AD%D8%B1%D8%A7%D8%AC%20%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%B1%D8%A7%D8%AA/?page={page}'
                  r = requests.get(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}, timeout=15)
                  soup = BeautifulSoup(r.text, 'html.parser')

                  # Parse structured JSON-LD ItemList embedded in the SSR page
                  found = 0
                  for ld_tag in soup.find_all('script', type='application/ld+json'):
                      try:
                          data = json.loads(ld_tag.string or '')
                          if data.get('@type') != 'WebPage':
                              continue
                          items = data.get('mainEntity', {}).get('itemListElement', [])
                          for it in items:
                              item = it.get('item', {})
                              title = item.get('name', '').strip()
                              # Skip if no model year in title — not a car for sale
                              if not YEAR_RE.search(title):
                                  continue
                              item_url = item.get('url', '')
                              id_m = re.search(r'haraj\.com\.sa/(\d{9,})', item_url)
                              if not id_m:
                                  continue
                              sid = id_m.group(1)
                              if sid in seen_ids:
                                  continue
                              seen_ids.add(sid)
                              images = item.get('image', [])
                              img_url = images[0] if images else None
                              rows.append({'source': 'haraj', 'source_id': sid, 'url': item_url, 'title': title, 'image_url': img_url})
                              found += 1
                      except Exception:
                          pass

                  print(f'Page {page}: found {found} car listings')
                  if found == 0:
                      break  # No more pages

              except Exception as e:
                  print(f'Page {page} error: {e}')

          if rows:
              resp = requests.post(SB_URL + '/rest/v1/listings', headers=HEADERS, data=json.dumps(rows))
              print(f'Upserted {len(rows)} rows, status {resp.status_code}')

          # Cleanup: remove any rows without a year in the title (safety net)
          del_resp = requests.delete(
              SB_URL + '/rest/v1/listings?image_url=not.is.null&title=not.like.*19[89]*&title=not.like.*200*&title=not.like.*201*&title=not.like.*202*',
              headers={**HEADERS, 'Prefer': 'return=representation'}
          )
          print(f'Cleanup status: {del_resp.status_code}')
          PYEOF
