name: Refresh Haraj Listings

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 << 'PYEOF'
          import re, requests
          from bs4 import BeautifulSoup

          SB_URL = __import__('os').environ['SUPABASE_URL']
          SB_KEY = __import__('os').environ['SUPABASE_KEY']
          HEADERS = {'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Prefer': 'resolution=merge-duplicates'}

          rows = []
          for page in range(1, 6):
              try:
                  r = requests.get(f'https://haraj.com.sa/search/%D8%B3%D9%8A%D8%A7%D8%B1%D8%A7%D8%AA/?page={page}', headers={'User-Agent': 'Mozilla/5.0'}, timeout=15)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = a['href']
                      id_m = re.search(r'haraj\.com\.sa/(\d{9,})', href)
                      if not id_m:
                          continue
                      sid = id_m.group(1)
                      img_tag = a.find('img')
                      img_url = None
                      if img_tag:
                          src = img_tag.get('src') or img_tag.get('data-src') or ''
                          if 'thumbcdn' in src:
                              # Strip any existing suffix and add -400x400.webp
                              src = re.sub(r'-\d+x\d+\.webp$', '', src)
                              if not src.endswith('.webp'):
                                  img_url = src + '-400x400.webp'
                              else:
                                  img_url = src
                      title_el = a.find(class_=re.compile('title|name|heading', re.I))
                      title = title_el.get_text(strip=True) if title_el else a.get_text(strip=True)[:80]
                      rows.append({'source': 'haraj', 'source_id': sid, 'url': href, 'title': title, 'image_url': img_url})
              except Exception as e:
                  print(f'Page {page} error: {e}')

          if rows:
              import json
              resp = requests.post(SB_URL + '/rest/v1/listings', headers=HEADERS, data=json.dumps(rows))
              print(f'Upserted {len(rows)} rows, status {resp.status_code}')
          PYEOF
